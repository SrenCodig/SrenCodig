<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Footer del perfil de Sergio Tovar Perdigon</title>
  <desc id="desc">Cierre visual con lineas de codigo y detalles en azul y turquesa.</desc>
  <defs>
    <linearGradient id="line" x1="80" y1="90" x2="1120" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wash" x1="600" y1="0" x2="600" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F2740" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0.36"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="180" rx="18" fill="#08111F"/>
  <rect width="1200" height="180" rx="18" fill="url(#wash)"/>
  <path d="M80 72H1120" stroke="url(#line)" stroke-width="2"/>
  <path d="M80 108H1120" stroke="url(#line)" stroke-opacity="0.35"/>
  <g fill="#7DD3FC" font-family="Courier New, monospace" font-size="18">
    <text x="132" y="98">&lt;/&gt;</text>
    <text x="1004" y="98">{ }</text>
  </g>
  <text x="600" y="101" text-anchor="middle" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="17">Sergio Tovar Perdigon  |  Ingenieria de Sistemas</text>
  <circle cx="600" cy="140" r="4" fill="#2DD4BF"/>
</svg>
