<svg width="680" height="210" viewBox="0 0 680 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cierre de terminal de Sergio Tovar Perdigón</title>
  <desc id="desc">Footer animado con arquitectura, contacto y estado de conexión.</desc>
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="680" y2="210"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#1b1630"/></linearGradient>
    <linearGradient id="footerLine" x1="30" y1="0" x2="650" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="footerGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text { font-family: 'Courier New', Courier, monospace; }
      .appear { opacity: 0; animation: appear .6s ease-out forwards; }.a1 { animation-delay: .2s; }.a2 { animation-delay: .6s; }.a3 { animation-delay: 1s; }.a4 { animation-delay: 1.4s; }
      .route { stroke-dasharray: 7 9; animation: route 8s linear infinite; }.shine { animation: shine 3s ease-in-out infinite; }.blink { animation: blink 1s step-end infinite; }.float { animation: float 3.5s ease-in-out infinite; }.spin { animation: spin 9s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } } @keyframes route { to { stroke-dashoffset: -128; } } @keyframes shine { 0%,100% { opacity: .25; } 50% { opacity: .9; } } @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } } @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } } @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect width="680" height="210" rx="16" fill="url(#footerBg)"/>
  <rect x="1" y="1" width="678" height="208" rx="15" fill="none" stroke="url(#footerLine)" stroke-opacity=".65"/>
  <path d="M30 34H650" stroke="url(#footerLine)" stroke-width="2" filter="url(#footerGlow)" class="shine"/>
  <text x="30" y="25" fill="#94a3b8" font-size="11">SrenCoding ~ / profile shutdown</text><text x="650" y="25" text-anchor="end" fill="#34d399" font-size="11">● ONLINE</text>
  <g class="appear a1"><text x="32" y="68" fill="#f59e0b" font-size="13">[SrenCoding ~]$</text><text x="165" y="68" fill="#f8fafc" font-size="13">git status --short</text><text x="32" y="91" fill="#34d399" font-size="13">clean</text><text x="105" y="91" fill="#cbd5e1" font-size="13">working tree ready for the next idea</text></g>
  <g class="appear a2"><path d="M32 119C135 104 178 151 273 126C356 104 409 105 493 128C548 143 601 140 648 119" stroke="#22d3ee" stroke-width="2" fill="none" class="route"/><circle cx="32" cy="119" r="4" fill="#22d3ee"/><circle cx="648" cy="119" r="4" fill="#f59e0b"/></g>
  <g class="appear a3"><text x="32" y="151" fill="#fb7185" font-size="12">CONTACT</text><text x="32" y="174" fill="#cbd5e1" font-size="13">github.com/SrenCodig</text><text x="265" y="174" fill="#cbd5e1" font-size="13">sergiotoper64@gmail.com</text></g>
  <g class="float"><circle cx="588" cy="160" r="27" fill="#a78bfa" opacity=".12"/><circle cx="588" cy="160" r="21" stroke="#a78bfa" stroke-opacity=".65" stroke-dasharray="2 5" fill="none" class="spin"/><path d="M577 161l8 8 15-19" stroke="#a78bfa" stroke-width="2" fill="none"/></g>
  <g class="appear a4"><text x="32" y="198" fill="#f59e0b" font-size="12">[SrenCoding ~]$</text><rect x="165" y="185" width="8" height="14" fill="#34d399" class="blink"/><text x="190" y="198" fill="#64748b" font-size="11">see you in the next commit</text></g>
</svg>
