<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sergio Tovar Perdigón - Arch terminal profile</title>
  <desc id="desc">Terminal personalizada y animada con la identidad profesional de Sergio Tovar Perdigón.</desc>
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="680" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#0d1117"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#172033"/></linearGradient>
    <linearGradient id="footerLine" x1="30" y1="0" x2="650" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="1" height="8" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#fff" opacity="0.035"/></pattern>
    <style>
      text { font-family: 'Courier New', Courier, monospace; }
      .reveal { opacity: 0; animation: reveal 0.45s ease-out forwards; }
      .r1 { animation-delay: .25s; }.r2 { animation-delay: .55s; }.r3 { animation-delay: .85s; }.r4 { animation-delay: 1.15s; }.r5 { animation-delay: 1.45s; }.r6 { animation-delay: 1.9s; }.r7 { animation-delay: 2.25s; }.r8 { animation-delay: 2.6s; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink 1.05s step-end infinite; }
      .scanline { animation: scanline 5s linear infinite; }
      .orbit { animation: orbit 7s linear infinite; transform-box: fill-box; transform-origin: center; }
      .bar1 { animation: load1 3s ease-in-out infinite alternate; }.bar2 { animation: load2 3.8s ease-in-out infinite alternate; }.bar3 { animation: load3 2.7s ease-in-out infinite alternate; }
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes scanline { from { transform: translateY(-35px); } to { transform: translateY(330px); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes load1 { from { width: 42px; } to { width: 94px; } }.bar2 { animation-name: load2; } @keyframes load2 { from { width: 28px; } to { width: 76px; } }.bar3 { animation-name: load3; } @keyframes load3 { from { width: 56px; } to { width: 106px; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    </style>
  </defs>
  <rect width="680" height="320" rx="14" fill="url(#aurora)"/>
  <rect x="1" y="1" width="678" height="318" rx="13" fill="none" stroke="url(#footerLine)" stroke-opacity=".65"/>
  <rect width="680" height="320" rx="14" fill="url(#scan)"/>
  <rect class="scanline" x="1" y="0" width="678" height="35" fill="#38bdf8" opacity=".035"/>
  <rect width="680" height="36" rx="14" fill="#161b22"/><rect y="24" width="680" height="12" fill="#161b22"/>
  <text x="340" y="23" text-anchor="middle" fill="#94a3b8" font-size="11">SrenCoding ~ / profile</text>
  <g class="reveal r1"><text x="24" y="65" font-size="13" fill="#f59e0b">[SrenCoding ~]$</text><text x="163" y="65" font-size="13" fill="#f8fafc">fastfetch --profile</text></g>
  <g class="reveal r2"><text x="24" y="88" font-size="13" fill="#fb7185">name</text><text x="105" y="88" font-size="13" fill="#64748b">::</text><text x="130" y="88" font-size="13" fill="#f8fafc">Sergio Tovar Perdigón</text><text x="445" y="88" font-size="13" fill="#a78bfa">uptime</text><text x="512" y="88" font-size="13" fill="#f8fafc">6 semesters</text></g>
  <g class="reveal r3"><text x="24" y="108" font-size="13" fill="#fb7185">role</text><text x="105" y="108" font-size="13" fill="#64748b">::</text><text x="130" y="108" font-size="13" fill="#f8fafc">Systems Engineering student</text><text x="445" y="108" font-size="13" fill="#a78bfa">lang</text><text x="512" y="108" font-size="13" fill="#f8fafc">es_CO</text></g>
  <g class="reveal r4"><text x="24" y="128" font-size="13" fill="#fb7185">focus</text><text x="105" y="128" font-size="13" fill="#64748b">::</text><text x="130" y="128" font-size="13" fill="#f8fafc">Web · Data · Systems</text><text x="445" y="128" font-size="13" fill="#a78bfa">mode</text><text x="512" y="128" font-size="13" fill="#34d399">building</text></g>
  <g class="reveal r5"><text x="24" y="148" font-size="13" fill="#fb7185">location</text><text x="105" y="148" font-size="13" fill="#64748b">::</text><text x="130" y="148" font-size="13" fill="#f8fafc">Villavicencio, Colombia</text><text x="445" y="148" font-size="13" fill="#a78bfa">repo</text><text x="512" y="148" font-size="13" fill="#f8fafc">SrenCodig</text></g>
  <path d="M24 165H656" stroke="#334155" stroke-dasharray="3 6"/>
  <g class="reveal r6"><text x="24" y="190" font-size="13" fill="#f59e0b">[SrenCoding ~]$</text><text x="163" y="190" font-size="13" fill="#f8fafc">cat stack.json</text></g>
  <g class="reveal r7"><text x="24" y="213" font-size="13" fill="#22d3ee">frontend</text><text x="130" y="213" font-size="13" fill="#f8fafc">HTML5  CSS3  JavaScript</text><text x="445" y="213" font-size="13" fill="#64748b">[</text><rect x="456" y="203" class="bar1" height="9" rx="4" fill="#22d3ee"/><text x="558" y="213" font-size="13" fill="#64748b">]</text></g>
  <g class="reveal r8"><text x="24" y="233" font-size="13" fill="#22d3ee">backend </text><text x="130" y="233" font-size="13" fill="#f8fafc">PHP  Python  SQL</text><text x="445" y="233" font-size="13" fill="#64748b">[</text><rect x="456" y="223" class="bar2" height="9" rx="4" fill="#fb7185"/><text x="540" y="233" font-size="13" fill="#64748b">]</text></g>
  <g class="float"><circle cx="618" cy="252" r="18" fill="#a78bfa" opacity=".1"/><path d="M606 252l8 8 16-18" stroke="#a78bfa" stroke-width="2" fill="none"/><circle cx="618" cy="252" r="23" stroke="#a78bfa" stroke-opacity=".4" stroke-dasharray="2 5" fill="none" class="orbit"/></g>
  <g class="reveal r8"><text x="24" y="270" font-size="13" fill="#22d3ee">database</text><text x="130" y="270" font-size="13" fill="#f8fafc">PostgreSQL  MongoDB</text><text x="445" y="270" font-size="13" fill="#64748b">[</text><rect x="456" y="260" class="bar3" height="9" rx="4" fill="#f59e0b"/><text x="570" y="270" font-size="13" fill="#64748b">]</text></g>
  <g class="reveal r8"><text x="24" y="300" font-size="13" fill="#f59e0b">[SrenCoding ~]$</text><rect x="163" y="287" width="8" height="14" fill="#34d399" class="blink"/><text x="190" y="300" font-size="11" fill="#64748b" class="pulse">ready to connect</text></g>
</svg>
